spring.application.name=SmartCampusHub

server.port=8080

# H2 database - saved outside OneDrive so records survive a restart
spring.datasource.url=jdbc:h2:file:${user.home}/SmartCampusHub-data/campushub
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Runs schema.sql on every start (it only creates tables that do not exist)
spring.sql.init.mode=always

# H2 console for checking the saved data (turn off before real use)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# PDF upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# Login session settings
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Folder where uploaded PDFs are stored
campushub.upload-dir=${user.home}/SmartCampusHub-data/uploads

# Office login
campushub.office.username=officer
campushub.office.password=Office@123

# Administrator login
campushub.admin.username=admin
campushub.admin.password=Admin@123